version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: greencity_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: greencity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: greencity_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: greencity_api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/greencity_db
      POSTGIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: greencity_ai_production_super_secret_jwt_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: greencity_worker
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/greencity_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
      - redis
    command: celery -A apps.worker.tasks worker --loglevel=info

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: greencity_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
